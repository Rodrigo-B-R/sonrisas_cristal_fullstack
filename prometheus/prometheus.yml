global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # La API: GET /metrics con el token (mismo METRICS_TOKEN del .env, montado como secreto).
  - job_name: api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["api:8000"]

  # PostgreSQL, a traves de postgres_exporter.
  - job_name: postgres
    static_configs:
      - targets: ["postgres_exporter:9187"]
